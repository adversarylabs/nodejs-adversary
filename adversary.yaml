name: lang/nodejs
version: 0.0.7
description: Reviews Node.js for security hazards and lifecycle cleanup leaks.

triggers:
  manual: true
  files_changed:
    - "**/*.js"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.ts"

detection:
  files:
    - "**/*.js"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.ts"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
